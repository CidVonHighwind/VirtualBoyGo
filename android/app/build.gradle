apply plugin: 'com.android.application'

android {
    namespace "com.nintendont.virtualboygo"
    ndkVersion "23.2.8568313"

    compileSdk 34

    defaultConfig {
        applicationId "com.nintendont.virtualboygo"
        minSdk 29
        targetSdk 34
        versionCode 7
        versionName "0.1.0"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
                cppFlags "-std=c++17"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "../../CMakeLists.txt"
            version "3.22.1"
        }
    }

    sourceSets {
        main {
            manifest.srcFile "AndroidManifest.xml"
            assets.srcDirs = ["../../assets"]
        }
    }

    // reference/keystore.txt: line 1 = store password, line 2 = key password.
    def keystoreDir = rootProject.file("../reference")
    def keystoreProps = new File(keystoreDir, "keystore.txt").readLines()
    signingConfigs {
        release {
            storeFile new File(keystoreDir, "android.keystore")
            storePassword keystoreProps[0].trim()
            keyAlias "key0"
            keyPassword keystoreProps[1].trim()
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}
